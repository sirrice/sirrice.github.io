<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Interactive VLDB 2026 paper shortlist and personal calendar.">
  <title>VLDB 2026 Paper Shortlist</title>
  <style>:root {
  --ink: #17212b;
  --muted: #66717c;
  --paper: #f7f5ef;
  --panel: #ffffff;
  --line: #dcdedb;
  --navy: #16283c;
  --accent: #f1614f;
  --focus: #f5d76e;
}

* { box-sizing: border-box; }

html, body { margin: 0; height: 100%; }

body {
  background: var(--paper);
  color: var(--ink);
  font-family: Arial, Helvetica, sans-serif;
  -webkit-font-smoothing: antialiased;
}

button, input { font: inherit; }
button { color: inherit; }

.app-shell { height: 100vh; overflow: hidden; }

.topbar {
  height: 58px;
  display: grid;
  grid-template-columns: minmax(420px, .82fr) minmax(620px, 1.38fr);
  align-items: center;
  padding: 0;
  background: var(--navy);
  color: white;
  border-bottom: 4px solid var(--accent);
}

.header-pane { min-width: 0; height: 54px; display: flex; align-items: center; gap: 12px; padding: 0 16px; }
.header-paper { border-right: 1px solid rgba(255,255,255,.16); }
.header-paper .title-block { flex: 1; min-width: 0; }
.header-calendar { justify-content: space-between; }
.calendar-title h2 { margin: 0; font: 500 21px/1 Georgia, "Times New Roman", serif; }

.brand-mark {
  width: 40px;
  height: 40px;
  display: grid;
  place-content: center;
  text-align: center;
  line-height: .9;
  border: 1px solid rgba(255,255,255,.45);
  letter-spacing: .08em;
  font-size: 8px;
}
.brand-mark strong { display: block; margin-top: 2px; font: 700 18px/1 Georgia, serif; color: var(--focus); }

.title-block h1 { margin: 0; font: 500 21px/1 Georgia, "Times New Roman", serif; }
.eyebrow, .section-label { margin: 0; text-transform: uppercase; letter-spacing: .15em; font-size: 9px; font-weight: 700; }
.eyebrow { color: #aebdca; }

.keyboard-guide { display: flex; gap: 20px; color: #cbd5de; font-size: 12px; }
.keyboard-guide span { display: flex; align-items: center; gap: 5px; }
.selection-import { display: flex; align-items: center; gap: 5px; min-width: 0; }
.selection-import input {
  width: 210px;
  min-width: 80px;
  padding: 6px 8px;
  border: 1px solid #66798b;
  border-radius: 4px;
  outline: none;
  color: white;
  background: #263b50;
  font: 11px/1.1 ui-monospace, SFMono-Regular, Menlo, monospace;
}
.selection-import input::placeholder { color: #9fb0bf; }
.selection-import input:focus { border-color: var(--focus); box-shadow: 0 0 0 2px rgba(245,215,110,.2); }
.selection-import button {
  padding: 6px 8px;
  border: 1px solid #718597;
  border-radius: 4px;
  color: white;
  background: #314a61;
  cursor: pointer;
  font-size: 10px;
  font-weight: 700;
}
.selection-import button:hover { border-color: white; }
kbd {
  min-width: 23px;
  padding: 4px 6px;
  border: 1px solid #6e7c89;
  border-bottom-width: 2px;
  border-radius: 4px;
  color: white;
  background: #263b50;
  text-align: center;
  font: 700 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
}

.workspace {
  height: calc(100vh - 58px);
  display: grid;
  grid-template-columns: minmax(420px, .82fr) minmax(620px, 1.38fr);
  overflow: hidden;
}

.paper-pane, .calendar-pane { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.paper-pane { background: #fbfaf7; border-right: 1px solid var(--line); }
.calendar-pane { background: #f0f1ee; }

.section-label { color: var(--accent); }
.subcopy { margin: 0; color: var(--muted); font-size: 12px; }

.selection-controls { display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: 7px; }
.selection-controls button, .empty-calendar button {
  padding: 7px 9px;
  border: 1px solid #c6cac8;
  border-radius: 4px;
  background: white;
  cursor: pointer;
  font-size: 11px;
  font-weight: 700;
}
.topbar .selection-controls { flex-wrap: nowrap; }
.topbar .selection-controls button { padding: 5px 7px; border-color: #66798b; color: white; background: #263b50; }
.topbar .count { color: #aebdca; }
.topbar .count strong { color: white; }
.selection-controls button:hover, .empty-calendar button:hover { border-color: var(--ink); }
.topbar .selection-controls button:hover { border-color: white; }
.count { color: var(--muted); font-size: 11px; margin-right: 3px; }
.count strong { color: var(--ink); font-size: 15px; }

.paper-list { flex: 1; min-height: 0; overflow: auto; overscroll-behavior: contain; scroll-behavior: smooth; }
.list-divider {
  position: sticky;
  top: 0;
  z-index: 2;
  display: flex;
  justify-content: space-between;
  padding: 9px 18px;
  border-bottom: 1px solid var(--line);
  background: #e8e9e5;
  color: #53606b;
  text-transform: uppercase;
  letter-spacing: .1em;
  font-size: 10px;
  font-weight: 700;
}

.paper-row {
  position: relative;
  display: grid;
  grid-template-columns: 30px 1fr 28px;
  gap: 10px;
  padding: 15px 14px 15px 16px;
  border-bottom: 1px solid #e6e6e2;
  background: #fff;
  cursor: default;
  outline: none;
  transition: background .14s ease, opacity .14s ease;
}
.paper-row:hover { background: #fcfbf4; }
.paper-row.is-active { background: #fff8d9; box-shadow: inset 4px 0 0 var(--accent); }
.paper-row.is-passed { opacity: .46; background: #f1f1ee; }
.paper-row.is-active.is-passed { opacity: .7; background: #f5f0dc; }

.check-wrap { position: relative; width: 24px; height: 24px; cursor: pointer; }
.check-wrap input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.custom-check {
  width: 22px;
  height: 22px;
  display: grid;
  place-items: center;
  border: 1.5px solid #aeb5b6;
  border-radius: 4px;
  background: white;
  color: transparent;
  font-size: 13px;
  font-weight: 900;
}
.check-wrap input:checked + .custom-check { border-color: var(--navy); background: var(--navy); color: white; }
.check-wrap input:focus-visible + .custom-check { outline: 3px solid var(--focus); outline-offset: 2px; }

.paper-meta { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; color: var(--muted); font-size: 10px; }
.talk-order { color: #344b60; font-weight: 800; }
.talk-time { color: #8a5b27; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 700; }
.topic-dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; }
.topic-dot.violet { background: #7753c6; }
.topic-dot.blue { background: #3b76b6; }
.topic-dot.teal { background: #24877c; }
.topic-dot.orange { background: #d87832; }
.topic-dot.rose { background: #b95970; }
.topic-dot.slate { background: #6f7c86; }
.paper-copy { min-width: 0; }
.paper-copy h3 { margin: 0 0 6px; font: 600 15px/1.28 Georgia, "Times New Roman", serif; }
.paper-footer { display: flex; align-items: flex-end; gap: 10px; min-width: 0; }
.paper-footer p {
  flex: 1;
  min-width: 0;
  margin: 0;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.35;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.paper-link {
  flex: 0 0 auto;
  padding: 3px 6px;
  border: 1px solid #bdc7ce;
  border-radius: 3px;
  color: #285b84;
  background: #f6fafc;
  text-decoration: none;
  text-transform: uppercase;
  letter-spacing: .04em;
  font: 700 9px/1.1 Arial, Helvetica, sans-serif;
}
.paper-link:hover { border-color: #285b84; background: #edf6fb; }
.paper-link:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.paper-link.pending { border-style: dashed; color: #8a9092; background: transparent; cursor: default; }
.row-number { color: #a9aeaf; font: 10px/1 ui-monospace, SFMono-Regular, Menlo, monospace; text-align: right; }

.saved-state { align-self: center; display: flex; align-items: center; gap: 7px; color: #cbd5de; font-size: 11px; }
.status-dot { width: 7px; height: 7px; border-radius: 50%; background: #3ca26d; box-shadow: 0 0 0 3px #dbefe3; }

.calendar-scroll { flex: 1; min-height: 0; overflow: auto; overscroll-behavior: contain; padding: 18px; }
.calendar-grid {
  min-width: 940px;
  display: grid;
  grid-template-columns: 76px repeat(3, minmax(270px, 1fr));
  align-items: stretch;
  border-top: 1px solid #d9dcd9;
  border-left: 1px solid #d9dcd9;
  background: #fff;
}
.calendar-grid > * { border-right: 1px solid #d9dcd9; border-bottom: 1px solid #d9dcd9; }
.calendar-corner, .day-heading, .time-heading { background: #f8f8f5; }
.calendar-corner { display: grid; place-content: center; padding: 12px 4px; color: var(--muted); text-align: center; font-size: 9px; text-transform: uppercase; letter-spacing: .06em; }
.calendar-corner span { display: block; color: var(--ink); font: 600 23px/1 Georgia, serif; }
.day-heading { padding: 14px 15px; }
.day-heading span { display: block; font: 600 17px/1.1 Georgia, serif; }
.day-heading strong { color: var(--muted); font-size: 9px; text-transform: uppercase; letter-spacing: .08em; }
.time-heading { padding: 14px 9px; color: var(--ink); }
.time-heading time { display: block; font: 600 13px/1.1 Georgia, serif; }
.time-heading span { color: var(--muted); font-size: 9px; }
.calendar-cell { min-height: 218px; padding: 8px; background: #fbfbf8; }

.calendar-event { margin-bottom: 8px; padding: 10px 10px 9px; border-left: 3px solid; border-radius: 2px; background: white; box-shadow: 0 1px 5px rgba(27,36,43,.07); }
.calendar-event:last-child { margin-bottom: 0; }
.calendar-event.violet { border-color: #7753c6; }
.calendar-event.blue { border-color: #3b76b6; }
.calendar-event.teal { border-color: #24877c; }
.calendar-event.orange { border-color: #d87832; }
.calendar-event.rose { border-color: #b95970; }
.calendar-event.slate { border-color: #6f7c86; }
.calendar-event header { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 7px; }
.calendar-event header h3 { margin: 0; font-size: 9px; text-transform: uppercase; letter-spacing: .08em; line-height: 1.25; }
.calendar-event header span { flex: 0 0 auto; color: var(--muted); font-size: 8px; }
.calendar-event ul { margin: 0; padding: 0; list-style: none; }
.calendar-event li { position: relative; padding: 6px 0 5px; border-top: 1px solid #eeeeea; font: 600 11px/1.28 Georgia, "Times New Roman", serif; }
.talk-slot { display: block; margin-bottom: 2px; color: #8a5b27; font: 700 9px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; }
.calendar-event li a { color: inherit; text-decoration-color: #b9c3c8; text-underline-offset: 2px; text-decoration-thickness: 1px; }
.calendar-event li a:hover { color: #285b84; text-decoration-color: currentColor; }
.calendar-event li a:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.calendar-event li a span { color: #597f9b; font-family: Arial, Helvetica, sans-serif; font-size: 9px; }
.open-slot { display: grid; min-height: 180px; place-items: center; color: #b0b5b3; text-transform: uppercase; letter-spacing: .12em; font-size: 9px; }

.empty-calendar { flex: 1; display: grid; place-content: center; justify-items: center; text-align: center; padding: 30px; }
.empty-calendar > span { font: 500 72px/1 Georgia, serif; color: #c8ccca; }
.empty-calendar h3 { margin: 10px 0 5px; font: 500 24px/1.1 Georgia, serif; }
.empty-calendar p { margin: 0 0 18px; color: var(--muted); font-size: 12px; }

.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; }

@media (max-width: 1100px) {
  .topbar { grid-template-columns: minmax(340px, .9fr) minmax(0, 1.1fr); }
  .workspace { grid-template-columns: minmax(340px, .9fr) minmax(0, 1.1fr); }
  .keyboard-guide span { font-size: 0; }
  .keyboard-guide kbd { font-size: 11px; }
  .selection-import input { width: 150px; }
  .saved-state { font-size: 0; }
}

@media (max-width: 820px) {
  html, body { height: auto; }
  .app-shell { height: auto; min-height: 100vh; overflow: visible; }
  .topbar { position: sticky; top: 0; z-index: 10; height: 56px; grid-template-columns: minmax(0, 1fr) auto; }
  .header-pane { height: 52px; padding: 0 10px; gap: 8px; }
  .header-calendar { padding-left: 4px; }
  .calendar-title, .saved-state { display: none; }
  .keyboard-guide { display: none; }
  .selection-import input { width: 135px; }
  .brand-mark { width: 38px; height: 38px; }
  .title-block h1 { font-size: 20px; }
  .workspace { height: auto; display: block; overflow: visible; }
  .paper-pane, .calendar-pane { min-height: calc(100vh - 56px); }
  .paper-pane { border-right: 0; }
  .paper-list { max-height: 68vh; }
  .calendar-pane { border-top: 4px solid var(--accent); }
  .calendar-scroll { overflow: auto; }
}

@media (max-width: 520px) {
  .brand-mark, .eyebrow, .title-block { display: none; }
  .keyboard-guide { gap: 5px; }
  .keyboard-guide kbd:nth-child(2) { display: none; }
  .selection-controls { max-width: 150px; }
  .selection-controls .count { width: 100%; text-align: right; }
  .paper-meta span:last-child { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  * { scroll-behavior: auto !important; transition: none !important; }
}
</style>
</head>

  <main class="app-shell">
    <header class="topbar">
      <div class="header-pane header-paper">
        <div class="brand-mark" aria-label="VLDB 2026"><span>VLDB</span><strong>26</strong></div>
        <div class="title-block">
          <p class="eyebrow">Boston · September 1–3</p>
          <h1 id="paper-list-heading">Paper shortlist</h1>
        </div>
        <div class="selection-controls">
          <span class="count"><strong id="selected-count">0</strong> / <span id="paper-count">0</span></span>
          <button type="button" id="check-all">Check all</button>
          <button type="button" id="clear-all">Clear</button>
        </div>
      </div>
      <div class="header-pane header-calendar">
        <div class="calendar-title">
          <p class="eyebrow">Live schedule</p>
          <h2 id="calendar-heading">Calendar</h2>
        </div>
        <form class="selection-import" id="selection-import">
          <label class="sr-only" for="paper-id-import">Paper IDs or shared URL</label>
          <input id="paper-id-import" type="text" placeholder=".p-9cf48e2b7a8f…" title="Copy this selection fragment, or edit it and set the selection" aria-describedby="import-status">
          <button type="submit">Set</button>
          <span class="sr-only" id="import-status" aria-live="polite"></span>
        </form>
        <div class="keyboard-guide" aria-label="Keyboard shortcuts">
          <span><kbd>J</kbd><kbd>K</kbd> move</span>
          <span><kbd>X</kbd> toggle</span>
        </div>
        <div class="saved-state"><span class="status-dot"></span>Saved in browser + URL</div>
      </div>
    </header>

    <div class="workspace">
      <section class="paper-pane" aria-labelledby="paper-list-heading">
        <div class="paper-list" id="paper-list" role="listbox" aria-label="Shortlisted papers"></div>
      </section>
      <section class="calendar-pane" id="calendar-content" aria-labelledby="calendar-heading"></section>
    </div>
    <div class="sr-only" id="selection-status" aria-live="polite"></div>
  </main>

om A","session":"Cohesive Subgraph Discovery"},{"id":"s54-p2","stableId":"p-c6b86b45251d","shortlisted":false,"sessionOrder":2,"sessionPaperCount":5,"estimatedStart":"16:03","estimatedEnd":"16:21","title":"Revisiting the Maximum Defective Clique Problem: Faster Branching and a Tighter Upper Bound","authors":["Kewu Yang","Kaiqiang Yu","Shengxin Liu","Zhaoquan Gu"],"day":"Thursday","time":"15:45 – 17:15","location":"Commonwealth Ballroom A","session":"Cohesive Subgraph Discovery"},{"id":"s54-p3","stableId":"p-7e6d50a36ee3","shortlisted":false,"sessionOrder":3,"sessionPaperCount":5,"estimatedStart":"16:21","estimatedEnd":"16:39","title":"Maximum Defective Biclique Search in Large Bipartite Graphs","authors":["Donghang Cui","Ronghua Li","Qiangqiang Dai","Hongchao Qin","Guoren Wang"],"day":"Thursday","time":"15:45 – 17:15","location":"Commonwealth Ballroom A","session":"Cohesive Subgraph Discovery"},{"id":"s54-p4","stableId":"p-f0ad85219d36","shortlisted":false,"sessionOrder":4,"sessionPaperCount":5,"estimatedStart":"16:39","estimatedEnd":"16:57","title":"CREST: Approximate k-Clique Counting in Real-World Networks via Refinement of Star-Based Sample Space","authors":["Yehyun Nam","Jihoon Jang","Kunsoo Park","Joong Chae Na","Hyunjoon Kim"],"day":"Thursday","time":"15:45 – 17:15","location":"Commonwealth Ballroom A","session":"Cohesive Subgraph Discovery"},{"id":"s54-p5","stableId":"p-2ad8c90eee3c","shortlisted":false,"sessionOrder":5,"sessionPaperCount":5,"estimatedStart":"16:57","estimatedEnd":"17:15","title":"Scalable Approximate Biclique Counting over Large Bipartite Graphs","authors":["Jingbang Chen","Weinuo Li","Yingli Zhou","Hangrui Zhou","Qiuyang Mang","Can Wang","Yixiang Fang","Chenhao Ma"],"day":"Thursday","time":"15:45 – 17:15","location":"Commonwealth Ballroom A","session":"Cohesive Subgraph Discovery"}];
    const STORAGE_KEY = "vldb-2026-selected-v3";
    const LEGACY_STABLE_STORAGE_KEY = "vldb-2026-shortlist-unchecked-v2";
    const LEGACY_POSITION_STORAGE_KEY = "vldb-2026-shortlist-unchecked-v1";
    const DAYS = ["Tuesday", "Wednesday", "Thursday"];
    const TIMES = ["10:45 – 12:15", "13:45 – 15:15", "15:45 – 17:15"];
    let checked = new Set(papers.filter((paper) => paper.shortlisted).map((paper) => paper.stableId));
    let activeIndex = 0;

    const paperList = document.getElementById("paper-list");
    const calendarContent = document.getElementById("calendar-content");
    const selectedCount = document.getElementById("selected-count");
    const paperCount = document.getElementById("paper-count");
    const selectionStatus = document.getElementById("selection-status");
    const importForm = document.getElementById("selection-import");
    const importInput = document.getElementById("paper-id-import");
    const importStatus = document.getElementById("import-status");
    const validStableIds = new Set(papers.map((paper) => paper.stableId));

    function element(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function sessionTone(session) {
      const text = session.toLowerCase();
      if (text.includes("llm") || text.includes("semantic") || text.includes("rag")) return "violet";
      if (text.includes("provenance") || text.includes("trusted") || text.includes("privacy")) return "blue";
      if (text.includes("lake") || text.includes("heterogeneous")) return "teal";
      if (text.includes("interactive") || text.includes("debug")) return "orange";
      if (text.includes("pipeline") || text.includes("preparation")) return "rose";
      return "slate";
    }

    function paperIdsFromText(text) {
      return [...new Set((text.match(/p-[0-9a-f]{12}/gi) || []).map((id) => id.toLowerCase()))]
        .filter((id) => validStableIds.has(id));
    }

    function encodeSelection() {
      return papers
        .filter((paper) => checked.has(paper.stableId))
        .map((paper) => paper.stableId)
        .join(".");
    }

    function selectionFromHash() {
      const code = new URLSearchParams(location.hash.slice(1)).get("papers");
      if (code === null) return null;
      const requested = new Set(code ? code.split(".") : []);
      return new Set(
        papers.filter((paper) => requested.has(paper.stableId)).map((paper) => paper.stableId),
      );
    }

    function updateSelectionHash() {
      const params = new URLSearchParams(location.hash.slice(1));
      params.delete("sel");
      params.set("papers", encodeSelection());
      const next = `${location.pathname}${location.search}#${params.toString()}`;
      try {
        history.replaceState(null, "", next);
      } catch (_) {
        location.hash = params.toString();
      }
    }

    function loadState() {
      const sharedSelection = selectionFromHash();
      if (sharedSelection) {
        checked = sharedSelection;
        return;
      }
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const selected = new Set(JSON.parse(saved));
          checked = new Set(papers.filter((paper) => selected.has(paper.stableId)).map((paper) => paper.stableId));
          return;
        }
        const legacyStableSaved = localStorage.getItem(LEGACY_STABLE_STORAGE_KEY);
        if (legacyStableSaved) {
          const legacyUnchecked = new Set(JSON.parse(legacyStableSaved));
          checked = new Set(papers.filter((paper) => paper.shortlisted && !legacyUnchecked.has(paper.stableId)).map((paper) => paper.stableId));
          return;
        }
        const legacyPositionSaved = localStorage.getItem(LEGACY_POSITION_STORAGE_KEY);
        if (!legacyPositionSaved) return;
        const legacyUnchecked = new Set(JSON.parse(legacyPositionSaved));
        checked = new Set(papers.filter((paper) => paper.shortlisted && !legacyUnchecked.has(paper.id)).map((paper) => paper.stableId));
      } catch (_) {
        // Some privacy modes block storage; the app still works for the current visit.
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify([...checked]));
      } catch (_) {}
      updateSelectionHash();
    }

    function makePaperLink(paper, compact) {
      const lastAuthor = paper.authors[paper.authors.length - 1] || "";
      const searchUrl = `https://www.google.com/search?q=${encodeURIComponent(`"${paper.title}" "${lastAuthor}"`)}`;
      const link = element("a", compact ? "" : "paper-link", compact ? paper.title : `${paper.paperUrl ? (paper.paperSource === "arXiv" ? "arXiv" : "PDF") : "Search"} ↗`);
      link.href = paper.paperUrl || searchUrl;
      link.target = "_blank";
      link.rel = "noreferrer";
      link.title = paper.paperUrl ? `Open ${paper.paperSource || "paper"}` : "Search Google by title and last author";
      if (compact) {
        const arrow = element("span", "", " ↗");
        arrow.setAttribute("aria-hidden", "true");
        link.appendChild(arrow);
      }
      link.addEventListener("click", (event) => event.stopPropagation());
      return link;
    }

    function buildPaperList() {
      paperList.replaceChildren();
      papers.forEach((paper, index) => {
        const previous = papers[index - 1];
        const startsBlock = !previous || `${previous.day}${previous.time}` !== `${paper.day}${paper.time}`;
        if (startsBlock) {
          const divider = element("div", "list-divider");
          divider.setAttribute("aria-hidden", "true");
          divider.append(element("span", "", paper.day), element("time", "", paper.time));
          paperList.appendChild(divider);
        }

        const article = element("article", "paper-row");
        article.dataset.paperIndex = String(index);
        article.dataset.paperId = paper.stableId;
        article.setAttribute("role", "option");
        article.tabIndex = index === activeIndex ? 0 : -1;
        article.addEventListener("click", () => setActive(index));
        article.addEventListener("focus", () => setActive(index));

        const label = element("label", "check-wrap");
        label.addEventListener("click", (event) => event.stopPropagation());
        const checkbox = element("input");
        checkbox.type = "checkbox";
        checkbox.dataset.paperId = paper.stableId;
        checkbox.addEventListener("change", () => togglePaper(paper.stableId));
        const customCheck = element("span", "custom-check", "✓");
        customCheck.setAttribute("aria-hidden", "true");
        label.append(checkbox, customCheck);

        const copy = element("div", "paper-copy");
        const meta = element("div", "paper-meta");
        meta.append(
          element("span", "talk-order", `Talk ${paper.sessionOrder}/${paper.sessionPaperCount}`),
          element("span", "talk-time", `~${paper.estimatedStart}–${paper.estimatedEnd}`),
          element("span", "", "·"),
          element("span", `topic-dot ${sessionTone(paper.session)}`),
          element("span", "", paper.session),
          element("span", "", "·"),
          element("span", "", paper.location),
        );
        meta.children[2].setAttribute("aria-hidden", "true");
        meta.children[5].setAttribute("aria-hidden", "true");
        const title = element("h3", "", paper.title);
        const footer = element("div", "paper-footer");
        const authors = element("p", "", paper.authors.join(", "));
        authors.title = paper.authors.join(", ");
        footer.append(authors, makePaperLink(paper, false));
        copy.append(meta, title, footer);

        const rowNumber = element("span", "row-number", String(index + 1).padStart(2, "0"));
        rowNumber.setAttribute("aria-hidden", "true");
        article.append(label, copy, rowNumber);
        paperList.appendChild(article);
      });
      updateRows();
    }

    function setActive(index) {
      activeIndex = Math.max(0, Math.min(papers.length - 1, index));
      document.querySelectorAll(".paper-row").forEach((row, rowIndex) => {
        const active = rowIndex === activeIndex;
        row.classList.toggle("is-active", active);
        row.tabIndex = active ? 0 : -1;
        row.setAttribute("aria-selected", String(active));
      });
      document.querySelector(`[data-paper-index="${activeIndex}"]`)?.scrollIntoView({ block: "nearest", behavior: "smooth" });
    }

    function updateRows() {
      document.querySelectorAll(".paper-row").forEach((row) => {
        const id = row.dataset.paperId;
        const isChecked = checked.has(id);
        row.classList.toggle("is-passed", !isChecked);
        const checkbox = row.querySelector("input[type=checkbox]");
        checkbox.checked = isChecked;
        checkbox.setAttribute("aria-label", `${isChecked ? "Remove" : "Add"} ${papers.find((paper) => paper.stableId === id).title}`);
      });
      setActive(activeIndex);
    }

    function updateCounts() {
      selectedCount.textContent = String(checked.size);
      paperCount.textContent = String(papers.length);
      selectionStatus.textContent = `${checked.size} of ${papers.length} papers checked.`;
      const encoded = encodeSelection();
      importInput.value = encoded ? `.${encoded}` : "";
    }

    function togglePaper(id) {
      if (checked.has(id)) checked.delete(id);
      else checked.add(id);
      saveState();
      updateRows();
      updateCounts();
      renderCalendar();
    }

    function groupBySession(items) {
      const groups = new Map();
      items.forEach((paper) => {
        const key = `${paper.session}|||${paper.location}`;
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(paper);
      });
      return groups;
    }

    function renderCalendar() {
      const selected = papers.filter((paper) => checked.has(paper.stableId));
      calendarContent.replaceChildren();
      if (!selected.length) {
        const empty = element("div", "empty-calendar");
        empty.append(element("span", "", "0"), element("h3", "", "No papers checked"), element("p", "", "Check papers in the shortlist to rebuild your calendar."));
        const restore = element("button", "", "Restore all papers");
        restore.type = "button";
        restore.addEventListener("click", selectAll);
        empty.appendChild(restore);
        calendarContent.appendChild(empty);
        return;
      }

      const scroll = element("div", "calendar-scroll");
      const grid = element("div", "calendar-grid");
      const corner = element("div", "calendar-corner");
      corner.append(element("span", "", String(selected.length)), document.createTextNode(" selected"));
      grid.appendChild(corner);

      DAYS.forEach((day) => {
        const heading = element("div", "day-heading");
        const count = selected.filter((paper) => paper.day === day).length;
        heading.append(element("span", "", day), element("strong", "", `${count} papers`));
        grid.appendChild(heading);
      });

      TIMES.forEach((time) => {
        const timeHeading = element("div", "time-heading");
        const [start, end] = time.split(" – ");
        timeHeading.append(element("time", "", start), element("span", "", end));
        grid.appendChild(timeHeading);

        DAYS.forEach((day) => {
          const cell = element("div", "calendar-cell");
          const slot = selected.filter((paper) => paper.day === day && paper.time === time);
          groupBySession(slot).forEach((group, key) => {
            const [session, location] = key.split("|||");
            const event = element("article", `calendar-event ${sessionTone(session)}`);
            const header = element("header");
            header.append(element("h3", "", session), element("span", "", location));
            const list = element("ul");
            group.forEach((paper) => {
              const item = element("li");
              item.appendChild(element("span", "talk-slot", `Talk ${paper.sessionOrder}/${paper.sessionPaperCount} · ~${paper.estimatedStart}–${paper.estimatedEnd}`));
              item.appendChild(makePaperLink(paper, true));
              list.appendChild(item);
            });
            event.append(header, list);
            cell.appendChild(event);
          });
          if (!slot.length) cell.appendChild(element("span", "open-slot", "Open"));
          grid.appendChild(cell);
        });
      });
      scroll.appendChild(grid);
      calendarContent.appendChild(scroll);
    }

    function selectAll() {
      checked = new Set(papers.map((paper) => paper.stableId));
      saveState();
      updateRows();
      updateCounts();
      renderCalendar();
    }

    function clearAll() {
      checked = new Set();
      saveState();
      updateRows();
      updateCounts();
      renderCalendar();
    }

    document.getElementById("check-all").addEventListener("click", selectAll);
    document.getElementById("clear-all").addEventListener("click", clearAll);
    importForm.addEventListener("submit", (event) => {
      event.preventDefault();
      if (!importInput.value.trim()) {
        clearAll();
        importStatus.textContent = "Selection cleared";
        return;
      }
      const ids = paperIdsFromText(importInput.value);
      if (!ids.length) {
        importStatus.textContent = "No valid paper IDs found";
        return;
      }
      checked = new Set(ids);
      saveState();
      updateRows();
      updateCounts();
      renderCalendar();
      importStatus.textContent = `Set selection to ${ids.length} paper${ids.length === 1 ? "" : "s"}`;
    });
    window.addEventListener("keydown", (event) => {
      const target = event.target;
      if (target?.isContentEditable || ["INPUT", "TEXTAREA", "SELECT"].includes(target?.tagName)) return;
      const key = event.key.toLowerCase();
      if (key === "j" || key === "k") {
        event.preventDefault();
        setActive(activeIndex + (key === "j" ? 1 : -1));
      } else if (key === "x") {
        event.preventDefault();
        togglePaper(papers[activeIndex].stableId);
      }
    });

    loadState();
    buildPaperList();
    updateCounts();
    renderCalendar();
    updateSelectionHash();
  </script>
</body>
